{% load humanize %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* Estilos para la sección del héroe */
        .hero-section {
            position: relative;
            background-image: url('{% static "media/misImagen/categoria.png" %}');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 400px;
        }

        /* Oscurecimiento de la imagen de fondo */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.8) 0%,
                rgba(0, 0, 0, 0.9) 100%
            );
        }

        /* Animación para el contenido del héroe */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-content {
            animation: fadeIn 1s ease-out;
        }

        /* Hacer que todas las tarjetas tengan la misma altura */
        .categoria-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <div class="w-full p-4 bg-blue-50">
        <!-- Hero Section con imagen de fondo oscurecida -->
        <section class="hero-section">
            <!-- Capa de oscurecimiento -->
            <div class="hero-overlay"></div>
            
            <!-- Contenido del Hero -->
            <div class="relative z-10 container mx-auto px-4 h-full">
                <div class="flex flex-col justify-center h-full hero-content py-20">
                    <div class="max-w-3xl mx-auto text-center">
                        <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-white mb-6">
                            <span class="block">Gran variedad en</span>
                            <span class="block text-blue-400">Repuestos automotrices</span>
                        </h1>
                        <p class="text-xl text-gray-200 mb-8">
                            Confía en nuestro servicio y cuida de tu automóvil con las marcas líderes del mercado.
                        </p>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- Categorías Principales -->
        <div class="w-full p-4 mx-auto px-4 sm:px-6 lg:px-8 -mt-16 relative z-20">
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                {% for category in categorias %}
                <a href="{% url 'productos_por_categoria' category.id %}" class="block">
                    <div class="categoria-card bg-white rounded-xl shadow-lg p-6 transform hover:-translate-y-1 transition-all duration-300">
                        <h3 class="text-lg font-bold text-center text-gray-900 mb-2">{{ category.nombre }}</h3>
                        <p class="text-sm text-gray-600 text-center">{{ category.descripcion }}</p>
                    </div>
                </a>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
