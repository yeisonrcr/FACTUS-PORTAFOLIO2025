{% extends 'base1.html' %}

{% block title %}Crear Producto{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <!-- Título centrado y estilizado -->
    <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 text-center mb-8">
        <span class="inline-block border-b-4 border-blue-500 pb-2">Crear Producto</span>
    </h1>

    <!-- Formulario estilizado -->
    <form method="post" enctype="multipart/form-data" 
          class="bg-white border border-gray-900 rounded-lg shadow-md p-6 space-y-4">
        {% csrf_token %}
        
        <!-- Renderizado del formulario Django -->
        <div class="space-y-4">
            {{ form.as_p }}
        </div>
        
        <!-- Botón de envío -->
        <button type="submit" 
                class="bg-green-700 text-white font-medium py-2 px-4 rounded-md shadow-sm hover:bg-yellow-600 transition duration-200 w-full">
            Crear Producto
        </button>
    </form>
</div>



{% endblock %}
