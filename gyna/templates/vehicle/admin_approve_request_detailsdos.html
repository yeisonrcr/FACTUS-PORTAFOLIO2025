{% extends 'vehicle/adminbase.html' %}
{% load widget_tweaks %}
{% block content %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <title>Editar distribuidora</title>
</head>
<body class="bg-gray-50">
    <br><br><br>
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h3 class="text-center text-2xl font-bold mb-6">Lugares donde se solicitó los repuestos</h3>
        <form method="post">
            {% csrf_token %}
            <input type="text" id="distribuidorax" name="distribuidorax" value="{{ request_instance.distribuidorax }}" class="w-full p-3 border border-gray-300 rounded-lg mb-4">
            <input type="submit" value="Actualizar" class="w-full bg-green-500 text-white py-3 px-4 rounded-lg cursor-pointer hover:bg-green-600">
        </form>
    </div>
</body>
</html>

{% endblock content %}
