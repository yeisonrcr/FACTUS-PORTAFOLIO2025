<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</head>
<body class="bg-white">

    <!-- navbar -->
    <nav class="bg-gradient-to-r from-green-500 via-yellow-500 to-blue-500  shadow-md">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <!-- nav left -->
                <div class="flex items-center"> 
                    <a href="{% url 'lista_repuestos' %}" class="text-xl font-semibold text-gray-800 hover:text-blue-700 transition duration-300"> 
                        Inicio 
                    </a> 
                </div>

                <!-- search form (responsive) -->
                <div class="flex-1 flex items-center justify-center px-6">
                    <form action="{% url 'admin-busqueda' %}" method="get" class="w-full max-w-lg relative">
                        <input 
                            type="text" 
                            name="datosbusqueda" 
                            class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-100"
                            placeholder="  Buscar  ">
                        <button type="submit" class="absolute right-3 top-2.5 text-gray-500">
                            <i class="fas fa-search"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- content -->
    <div class="w-full px-0 py-0 bg-gradient-to-r from-green-200 via-yellow-100 to-blue-200">
        {% block content %}
        {% endblock content %}
    </div>

    <script>
        function toggleUserMenu() {
            const menu = document.getElementById('user-menu');
            menu.classList.toggle('hidden');
        }

        function switchTheme() {
            const darkIcon = document.getElementById('darkIcon');
            const lightIcon = document.getElementById('lightIcon');
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');
            document.body.classList.toggle('dark');
        }

        // Click fuera del menú para cerrarlo
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('user-menu');
            const userButton = event.target.closest('button');
            if (!userButton && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
